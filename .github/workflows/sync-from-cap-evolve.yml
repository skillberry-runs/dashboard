name: Sync from cap-evolve

# Copies run records (and run notes) that landed on cap-evolve's `benchmark-history`
# branch into this repo, then redeploys the dashboard. Run it whenever you want newer
# cap-evolve runs on the dashboard: Actions → "Sync from cap-evolve" → Run workflow.
# Safe to repeat: records already here are skipped. See scripts/sync_from_cap_evolve.py
# and PUBLISHING.md. Retire this workflow when cap-evolve's CI writes here directly.
#
# cap-evolve is public, so reading it needs no token. Writing uses the built-in
# GITHUB_TOKEN; the dispatch below is the one kind of event that token may trigger.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would change (write nothing)"
        type: boolean
        default: false
      update_existing:
        description: "Also overwrite records that already exist here but differ from cap-evolve's copy"
        type: boolean
        default: false

permissions:
  contents: write   # push the new records
  actions: write    # dispatch pages.yml afterwards

concurrency:
  group: sync-from-cap-evolve
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync
        id: sync
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          UPDATE_EXISTING: ${{ inputs.update_existing }}
        run: |
          args=""
          [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
          [ "$UPDATE_EXISTING" = "true" ] && args="$args --update-existing"
          python3 scripts/sync_from_cap_evolve.py $args | tee sync.log
          { echo '### Sync from cap-evolve'; echo '```'; cat sync.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate records
        if: steps.sync.outputs.changed == 'true'
        run: python3 scripts/check_records.py

      - name: Commit and push
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "skillberry-bot"
          git config user.email "actions@github.com"
          git add records notes
          git commit -m "records: sync ${{ steps.sync.outputs.added }} new / ${{ steps.sync.outputs.updated }} updated from cap-evolve benchmark-history"
          git push origin main

      # Pushes made with GITHUB_TOKEN don't start other workflows, but a workflow_dispatch does.
      - name: Redeploy the dashboard
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
