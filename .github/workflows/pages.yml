name: Deploy dashboard

# Publishes site/ to GitHub Pages (https://skillberry-runs.github.io/dashboard/),
# with benchmarks.json/meta.json rendered fresh from records/ on every deploy.
# The aggregate is never committed: it's every record ever written, so committing
# it per run would rewrite an ever-growing file forever. records/<id>.json is the
# source of truth (one small additive file per run).
#
# Also renders a report section per benchmark listed in sections.json (see below).
#
# Triggers: a push to main that touches records/, site/, scripts/ or this file; nightly;
# manual dispatch, which is also how an external writer (cap-evolve's CI, or a
# results repo's notify workflow, running as skillberry-bot) requests a redeploy.

on:
  push:
    branches: [main]
    paths:
      - "records/**"
      - "notes/**"
      - "site/**"
      - "scripts/**"
      - "sections.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Nightly rebuild, so changes pushed to the benchmark repos (write-ups, ci_ui/) show up
  # without anyone running this by hand. The repos are public: no token needed.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A malformed record would show a broken row, or "—" where a reward should be.
      # Fail the deploy instead (the last good site stays live). See scripts/check_records.py.
      - name: Validate records
        run: python3 scripts/check_records.py

      - name: Render benchmarks.json + meta.json from records/
        run: |
          python3 scripts/record.py aggregate records \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out site
          python3 -c "import json; m=json.load(open('site/meta.json')); print(m); assert m['count'] > 0, 'no records rendered'"

      # Benchmark report sections: render each skillberry-runs results repo's
      # write-ups and report pages under site/<bench>/ (scripts/build_reports.py;
      # raw data/recipes/artifacts are not published, internal paths are masked).
      #
      # The repos are public (since 2026-11-17), so they are cloned without credentials.
      # If RESULTS_READ_TOKEN is set (a skillberry-bot fine-grained token, Contents: read),
      # it is used instead; that only matters if a section's repo is ever made private.
      - name: Render benchmark report sections
        env:
          RESULTS_READ_TOKEN: ${{ secrets.RESULTS_READ_TOKEN }}
        run: |
          pip install --quiet markdown
          rm -f site/ui_index.json   # rebuilt below from each repo's ci_ui/
          python3 -c "
          import json
          for x in json.load(open('sections.json')):
              print('|'.join([x['repo'], x['title'], 'pages' if x.get('site', True) else 'data-only']))
          " > _sections.txt
          # Fine-grained tokens expire on a fixed date. Log it every deploy and warn 30 days
          # ahead, so an expiry shows up as a warning first, not as a failed deploy.
          if [ -n "$RESULTS_READ_TOKEN" ]; then
            first=$(head -1 _sections.txt | cut -d'|' -f1)
            exp=$(curl -sI -H "Authorization: Bearer $RESULTS_READ_TOKEN" "https://api.github.com/repos/skillberry-runs/$first" \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="github-authentication-token-expiration"{print $2}')
            if [ -n "$exp" ]; then
              days=$(python3 -c 'import sys,datetime as d; e=d.datetime.strptime(sys.argv[1][:19],"%Y-%m-%d %H:%M:%S"); print((e-d.datetime.utcnow()).days)' "$exp")
              echo "RESULTS_READ_TOKEN expires $exp ($days days from now)"
              if [ "$days" -lt 30 ]; then
                echo "::warning::RESULTS_READ_TOKEN expires in $days days ($exp). Renew skillberry-bot's 'skillberry-runs-read' token and update this secret (and SKILLSBENCH_READ_TOKEN in skillberry-ai/cap-evolve, which uses the same token)."
              fi
            fi
          fi
          while IFS='|' read -r repo title kind <&3; do
            rm -rf "_src_$repo"
            if [ -n "$RESULTS_READ_TOKEN" ]; then
              url="https://x-access-token:${RESULTS_READ_TOKEN}@github.com/skillberry-runs/$repo.git"
            else
              url="https://github.com/skillberry-runs/$repo.git"
            fi
            git clone --depth 1 "$url" "_src_$repo" || {
              if [ -n "$RESULTS_READ_TOKEN" ]; then
                # Say WHY: who the token is, and GitHub's own reason for refusing it.
                api() { curl -s -H "Authorization: Bearer $RESULTS_READ_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/$1"; }
                echo "token owner: $(api user | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("login") or d.get("message"))')"
                echo "repo check:  $(api repos/skillberry-runs/$repo | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("full_name") or d.get("message"))')"
              fi
              echo "::error::cloning skillberry-runs/$repo failed (repo missing or private? token expired?)"; exit 1; }
            # "site": false in sections.json = no write-ups yet: publish its Open UI data only.
            if [ "$kind" = "pages" ]; then
              python3 scripts/build_reports.py --src "_src_$repo" --out "site/$repo" \
                --repo "skillberry-runs/$repo" --title "$title"
              test -f "site/$repo/index.html"
            fi
            # Per-run "Open UI" data (ci_ui/), opened by the shared viewer in site/viewer/.
            python3 scripts/publish_ci_ui.py --src "_src_$repo" --repo "$repo" --site site
          done 3< _sections.txt

      # Run notes for hand-published local runs (linked from records' summary_url).
      - name: Render run notes
        run: |
          python3 scripts/build_reports.py --src notes --out site/notes \
            --repo skillberry-runs/dashboard --src-prefix notes --source-public --title "Run notes"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
